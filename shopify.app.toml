# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a4efc0f35d8dc502a084e8a5cff57242"
name = "student_automatic_discount"
application_url = "https://student-automatic-discount.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_app_proxy,read_customers,write_customers,read_discounts,write_discounts,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://student-automatic-discount.onrender.com/auth/callback"
]

[app_proxy]
url = "https://student-automatic-discount.onrender.com"
subpath = "student-automatic-discount"
prefix = "apps"
